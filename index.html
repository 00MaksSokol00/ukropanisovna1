<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Татарские подарки — Каталог</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Вставьте сюда URL вашего веб-приложения Google Apps Script (заканчивается на /exec)
    const GOOGLE_SCRIPT_URL = '';

    const PRODUCTS = [
      {
        id: 1,
        category: 'books',
        title: 'Детская книга на татарском языке «Йокламаган песи»',
        description: 'Добрая сказка на татарском языке для малышей (автор Миннебаева Тансылу) с яркими иллюстрациями о непоседливом котёнке.',
        badge: 'Хит продаж',
        hasVariants: false,
        price: 200,
        pricePrefix: '',
        image: 'images/book-pesi.jpg',
        fallbackEmoji: '🐱',
        fallbackBg: 'from-amber-100 to-orange-100',
        fallbackLabel: 'Йокламаган песи'
      },
      {
        id: 9,
        category: 'books',
        title: 'Детская книга на татарском языке «Кызыксынучан тычкан»',
        description: 'Увлекательная история про любопытного мышонка на татарском языке (автор Миннебаева Тансылу) с красочными картинками.',
        badge: 'Новинка',
        hasVariants: false,
        price: 200,
        pricePrefix: '',
        image: 'images/book-mouse.jpg',
        fallbackEmoji: '🐭',
        fallbackBg: 'from-emerald-100 to-lime-100',
        fallbackLabel: 'Кызыксынучан тычкан'
      },
      {
        id: 2,
        category: 'cards',
        title: 'Открытки с цитатами из татарских песен',
        description: 'Набор из 35 открыток без повторов (размер 8×8 см) с душевными строками из любимых татарских песен.',
        badge: 'Набор 35 шт.',
        hasVariants: false,
        price: 230,
        pricePrefix: '',
        image: 'images/cards-quotes.jpg',
        fallbackEmoji: '🎵',
        fallbackBg: 'from-emerald-100 to-teal-100',
        fallbackLabel: '35 открыток • Песни'
      },
      {
        id: 3,
        category: 'cards',
        title: 'Открытки с татарскими пожеланиями',
        description: 'Набор из 33 открыток без повторов (размер 6×9 см) с тёплыми национальными пожеланиями на любой праздник.',
        badge: 'Набор 33 шт.',
        hasVariants: false,
        price: 220,
        pricePrefix: '',
        image: 'images/cards-wishes.jpg',
        fallbackEmoji: '💌',
        fallbackBg: 'from-sky-100 to-indigo-100',
        fallbackLabel: '33 открытки • Пожелания'
      },
      {
        id: 4,
        category: 'cards',
        title: 'Открытки на татарском для мамы',
        description: 'Трогательный набор из 18 открыток (9 уникальных нежных дизайнов по 2 экземпляра) для самой любимой мамы.',
        badge: 'Набор 18 шт.',
        hasVariants: false,
        price: 150,
        pricePrefix: '',
        image: 'images/cards-mom.jpg',
        fallbackEmoji: '💐',
        fallbackBg: 'from-rose-100 to-pink-100',
        fallbackLabel: 'Әниемә • 18 шт.'
      },
      {
        id: 7,
        category: 'books',
        title: 'Раскраска детская на татарском «Буяу татарча»',
        description: 'Развивающая раскраска «Табигать дөньясы» (3+) с подписями животных и природы на татарском языке.',
        badge: 'Для детей 3+',
        hasVariants: true,
        variants: [
          { id: 'ready', label: 'Готовый вариант', price: 150, prefix: '' },
          { id: 'custom', label: 'Индивидуальный заказ', price: 150, prefix: '' }
        ],
        image: 'images/coloring.jpg',
        fallbackEmoji: '🎨',
        fallbackBg: 'from-yellow-100 to-lime-100',
        fallbackLabel: 'Буяу татарча'
      },
      {
        id: 5,
        category: 'cards',
        title: 'Индивидуальные открытки',
        description: 'Разработка открытки с вашим текстом, именем или фото. Бумажный вариант зависит от тиража.',
        badge: 'На заказ',
        hasVariants: true,
        variants: [
          { id: 'digital', label: 'Электронный макет', price: 500, prefix: '' },
          { id: 'paper', label: 'Бумажный вариант', price: 250, prefix: 'от ' }
        ],
        requiresCustomText: true,
        customPlaceholder: 'Напишите пожелание или идею для открытки...',
        image: '',
        fallbackEmoji: '✨',
        fallbackBg: 'from-purple-100 to-fuchsia-100',
        fallbackLabel: 'Индивидуальный дизайн'
      },
      {
        id: 6,
        category: 'planners',
        title: 'Планер на неделю на татарском',
        description: 'Удобный недатированный планер для организации дел и привычек на родном языке.',
        badge: 'А4 / А5',
        hasVariants: true,
        variants: [
          { id: 'ready', label: 'Готовый вариант', price: 250, prefix: '' },
          { id: 'custom', label: 'Индивидуальный заказ', price: 250, prefix: '' }
        ],
        image: '',
        fallbackEmoji: '📅',
        fallbackBg: 'from-teal-100 to-cyan-100',
        fallbackLabel: 'Атналык планер'
      },
      {
        id: 8,
        category: 'planners',
        title: 'Календарь в виде вазы с цветами',
        description: 'Оригинальный настольный календарь, где каждый месяц — новый цветок в красивой вазе.',
        badge: 'Оригинально',
        hasVariants: true,
        variants: [
          { id: 'ready', label: 'Готовый вариант', price: 200, prefix: '' },
          { id: 'custom', label: 'Индивидуальный заказ', price: 250, prefix: 'от ' }
        ],
        image: '',
        fallbackEmoji: '🌷',
        fallbackBg: 'from-orange-100 to-rose-100',
        fallbackLabel: 'Календарь-ваза'
      }
    ];

    const CATEGORIES = [
      { id: 'all', label: 'Все товары' },
      { id: 'books', label: 'Книги и раскраски' },
      { id: 'cards', label: 'Открытки' },
      { id: 'planners', label: 'Планеры и календари' }
    ];

    const ProductMedia = ({ product, onPreview }) => {
      const [imgError, setImgError] = useState(false);

      if (product.image && !imgError) {
        return (
          <div 
            onClick={() => onPreview && onPreview(product)}
            className="h-64 w-full bg-stone-100 overflow-hidden cursor-zoom-in group relative"
          >
            <img
              src={product.image}
              alt={product.title}
              onError={() => setImgError(true)}
              className="w-full h-full object-cover object-center group-hover:scale-105 transition duration-300"
            />
            <span className="absolute bottom-2.5 right-2.5 bg-black/50 text-white text-[11px] px-2 py-0.5 rounded-md opacity-0 group-hover:opacity-100 transition">
              🔍 Увеличить
            </span>
          </div>
        );
      }

      return (
        <div className={`h-64 w-full bg-gradient-to-br ${product.fallbackBg} flex flex-col items-center justify-center p-4`}>
          <div className="bg-white/85 backdrop-blur-sm w-16 h-16 rounded-2xl shadow-sm mb-2.5 flex items-center justify-center text-3xl">
            {product.fallbackEmoji}
          </div>
          <span className="text-xs font-medium text-stone-700 bg-white/75 px-3 py-1 rounded-full">
            {product.fallbackLabel}
          </span>
        </div>
      );
    };

    function App() {
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [selectedVariants, setSelectedVariants] = useState({
        5: 'digital',
        6: 'ready',
        7: 'ready',
        8: 'ready'
      });
      const [customNotes, setCustomNotes] = useState({});
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [previewProduct, setPreviewProduct] = useState(null);
      const [logoError, setLogoError] = useState(false);

      const [customerName, setCustomerName] = useState('');
      const [customerContact, setCustomerContact] = useState('');
      const [deliveryMethod, setDeliveryMethod] = useState('СДЭК / Почта России');
      const [orderComment, setOrderComment] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [orderStatus, setOrderStatus] = useState(null);
      const [copied, setCopied] = useState(false);

      const filteredProducts = selectedCategory === 'all'
        ? PRODUCTS
        : PRODUCTS.filter(p => p.category === selectedCategory);

      const getProductPricing = (product) => {
        if (!product.hasVariants) {
          return { price: product.price, prefix: product.pricePrefix || '', variantLabel: '' };
        }
        const activeVariantId = selectedVariants[product.id] || product.variants[0].id;
        const variant = product.variants.find(v => v.id === activeVariantId) || product.variants[0];
        return { price: variant.price, prefix: variant.prefix || '', variantLabel: variant.label };
      };

      const addToCart = (product) => {
        const { price, prefix, variantLabel } = getProductPricing(product);
        const note = customNotes[product.id] || '';
        const cartKey = `${product.id}-${variantLabel}-${note}`;

        setCart(prev => {
          const existing = prev.find(item => item.cartKey === cartKey);
          if (existing) {
            return prev.map(item =>
              item.cartKey === cartKey ? { ...item, qty: item.qty + 1 } : item
            );
          }
          return [...prev, {
            cartKey,
            id: product.id,
            title: product.title,
            variantLabel,
            note,
            price,
            prefix,
            qty: 1
          }];
        });
      };

      const updateQty = (cartKey, delta) => {
        setCart(prev =>
          prev
            .map(item => item.cartKey === cartKey ? { ...item, qty: item.qty + delta } : item)
            .filter(item => item.qty > 0)
        );
      };

      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const hasFromPrice = cart.some(item => item.prefix === 'от ');

      const formatOrderText = () => {
        return cart.map((item, idx) => {
          const variantPart = item.variantLabel ? ` (${item.variantLabel})` : '';
          const notePart = item.note ? ` — Текст: "${item.note}"` : '';
          return `${idx + 1}. ${item.title}${variantPart} × ${item.qty} шт. = ${item.prefix}${item.price * item.qty} ₽${notePart}`;
        }).join('\n');
      };

      const handleCopyOrder = () => {
        const text = `Новый заказ:\nИмя: ${customerName || 'Не указано'}\nКонтакт: ${customerContact || 'Не указан'}\nДоставка: ${deliveryMethod}\n\nТовары:\n${formatOrderText()}\n\nИтого: ${hasFromPrice ? 'от ' : ''}${totalPrice} ₽`;
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      const handleSubmitOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0) return;

        setIsSubmitting(true);
        setOrderStatus(null);

        const payload = {
          name: customerName,
          contact: customerContact,
          delivery: deliveryMethod,
          itemsText: formatOrderText(),
          comment: orderComment,
          total: `${hasFromPrice ? 'от ' : ''}${totalPrice}`
        };

        if (!GOOGLE_SCRIPT_URL) {
          setTimeout(() => {
            setIsSubmitting(false);
            setOrderStatus({
              type: 'demo',
              message: 'Тестовый режим: вставьте ссылку Google Apps Script в GOOGLE_SCRIPT_URL, чтобы заявки уходили в таблицу и Telegram.'
            });
          }, 600);
          return;
        }

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          setOrderStatus({
            type: 'success',
            message: 'Заказ успешно отправлен! Мы скоро свяжемся с вами для подтверждения.'
          });
          setCart([]);
          setCustomerName('');
          setCustomerContact('');
          setOrderComment('');
        } catch (error) {
          setOrderStatus({
            type: 'error',
            message: 'Ошибка при отправке. Пожалуйста, скопируйте заказ кнопкой ниже и отправьте нам в мессенджер.'
          });
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen bg-stone-50 text-stone-800 font-sans">
          {/* Шапка с логотипом */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-stone-200">
            <div className="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                {!logoError ? (
                  <img
                    src="images/logo.jpg"
                    alt="Логотип"
                    onError={() => setLogoError(true)}
                    className="w-11 h-11 rounded-xl object-contain bg-white border border-stone-200 p-1 shadow-xs"
                  />
                ) : (
                  <div className="w-11 h-11 rounded-xl bg-emerald-700 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                    UR
                  </div>
                )}
                <div>
                  <h1 className="font-bold text-lg leading-tight text-stone-900">Татарские подарки</h1>
                  <p className="text-xs text-stone-500">Книги, открытки и планеры с душой</p>
                </div>
              </div>

              <button
                onClick={() => setIsCartOpen(true)}
                className="relative flex items-center gap-2 bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition shadow-sm"
              >
                <span>🛍️ Корзина</span>
                {totalItems > 0 && (
                  <span className="bg-amber-400 text-stone-900 font-bold text-xs px-2 py-0.5 rounded-full">
                    {totalItems}
                  </span>
                )}
              </button>
            </div>
          </header>

          {/* Главный баннер */}
          <section className="max-w-6xl mx-auto px-4 pt-8 pb-6">
            <div className="bg-gradient-to-r from-emerald-800 to-teal-700 rounded-3xl p-6 md:p-10 text-white shadow-md">
              <span className="inline-block bg-white/20 text-xs font-medium px-3 py-1 rounded-full mb-3">
                Авторская полиграфия на татарском языке
              </span>
              <h2 className="text-2xl md:text-4xl font-bold mb-3 max-w-2xl">
                Тёплые подарки и книги на родном языке для детей и близких
              </h2>
              <p className="text-emerald-100 text-sm md:text-base max-w-xl">
                Выбирайте готовые наборы открыток, сказки и планеры или заказывайте индивидуальный дизайн с вашими пожеланиями.
              </p>
            </div>
          </section>

          {/* Фильтры */}
          <section className="max-w-6xl mx-auto px-4 pb-6">
            <div className="flex gap-2 overflow-x-auto pb-2">
              {CATEGORIES.map(cat => (
                <button
                  key={cat.id}
                  onClick={() => setSelectedCategory(cat.id)}
                  className={`px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition ${
                    selectedCategory === cat.id
                      ? 'bg-stone-900 text-white shadow-sm'
                      : 'bg-white text-stone-600 hover:bg-stone-100 border border-stone-200'
                  }`}
                >
                  {cat.label}
                </button>
              ))}
            </div>
          </section>

          {/* Сетка товаров */}
          <main className="max-w-6xl mx-auto px-4 pb-16">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredProducts.map(product => {
                const { price, prefix } = getProductPricing(product);
                return (
                  <div
                    key={product.id}
                    className="bg-white rounded-2xl border border-stone-200 overflow-hidden flex flex-col justify-between shadow-sm hover:shadow-md transition"
                  >
                    <div>
                      <div className="relative">
                        <ProductMedia product={product} onPreview={setPreviewProduct} />
                        {product.badge && (
                          <span className="absolute top-3 left-3 bg-white/95 text-stone-800 text-xs font-semibold px-2.5 py-1 rounded-lg shadow-sm pointer-events-none">
                            {product.badge}
                          </span>
                        )}
                      </div>

                      <div className="p-5">
                        <h3 className="font-bold text-base text-stone-900 mb-2 leading-snug">
                          {product.title}
                        </h3>
                        <p className="text-sm text-stone-500 mb-4 leading-relaxed">
                          {product.description}
                        </p>

                        {product.hasVariants && (
                          <div className="mb-4">
                            <p className="text-xs font-medium text-stone-500 mb-1.5">Выберите вариант:</p>
                            <div className="grid grid-cols-2 gap-1.5 bg-stone-100 p-1 rounded-xl">
                              {product.variants.map(variant => {
                                const isSelected = (selectedVariants[product.id] || product.variants[0].id) === variant.id;
                                return (
                                  <button
                                    key={variant.id}
                                    type="button"
                                    onClick={() => setSelectedVariants(prev => ({ ...prev, [product.id]: variant.id }))}
                                    className={`text-xs py-1.5 px-2 rounded-lg font-medium transition text-center ${
                                      isSelected
                                        ? 'bg-white text-stone-900 shadow-sm'
                                        : 'text-stone-600 hover:text-stone-900'
                                    }`}
                                  >
                                    {variant.label}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        )}

                        {product.requiresCustomText && (
                          <div className="mb-3">
                            <input
                              type="text"
                              value={customNotes[product.id] || ''}
                              onChange={(e) => setCustomNotes(prev => ({ ...prev, [product.id]: e.target.value }))}
                              placeholder={product.customPlaceholder}
                              className="w-full text-xs border border-stone-200 rounded-xl px-3 py-2 focus:outline-none focus:border-emerald-600"
                            />
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="px-5 pb-5 pt-2 flex items-center justify-between border-t border-stone-100">
                      <div>
                        <span className="text-xs text-stone-400 block">Стоимость</span>
                        <span className="text-lg font-bold text-stone-900">
                          {prefix}{price} ₽
                        </span>
                      </div>

                      <button
                        type="button"
                        onClick={() => addToCart(product)}
                        className="flex items-center gap-1.5 bg-emerald-700 hover:bg-emerald-800 active:scale-95 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition"
                      >
                        <span>+ В корзину</span>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </main>

          {/* Модальное окно увеличения фото */}
          {previewProduct && (
            <div 
              onClick={() => setPreviewProduct(null)}
              className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4"
            >
              <div 
                onClick={e => e.stopPropagation()}
                className="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl"
              >
                <div className="p-4 border-b border-stone-200 flex items-center justify-between">
                  <h4 className="font-bold text-sm text-stone-900 pr-4">{previewProduct.title}</h4>
                  <button
                    onClick={() => setPreviewProduct(null)}
                    className="text-stone-500 hover:text-stone-900 font-bold px-2 py-1"
                  >
                    ✕
                  </button>
                </div>
                <div className="bg-stone-100 flex items-center justify-center max-h-[75vh] overflow-hidden">
                  <img 
                    src={previewProduct.image} 
                    alt={previewProduct.title} 
                    className="w-full h-auto max-h-[75vh] object-contain"
                  />
                </div>
              </div>
            </div>
          )}

          {/* Выдвижная корзина */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/40">
              <div className="bg-white w-full max-w-md h-full flex flex-col justify-between shadow-2xl">
                <div className="p-5 border-b border-stone-200 flex items-center justify-between">
                  <h3 className="font-bold text-lg">🛍️ Ваш заказ</h3>
                  <button
                    onClick={() => setIsCartOpen(false)}
                    className="p-2 text-stone-400 hover:text-stone-700 rounded-lg text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-5 space-y-5">
                  {cart.length === 0 ? (
                    <div className="text-center py-12 text-stone-400">
                      <p className="text-3xl mb-2">🛒</p>
                      <p className="text-sm">Корзина пока пуста</p>
                    </div>
                  ) : (
                    <>
                      <div className="space-y-3">
                        {cart.map(item => (
                          <div key={item.cartKey} className="bg-stone-50 p-3.5 rounded-xl border border-stone-200">
                            <div className="flex justify-between gap-2 mb-1">
                              <h4 className="font-semibold text-sm text-stone-900">{item.title}</h4>
                              <button
                                onClick={() => updateQty(item.cartKey, -item.qty)}
                                className="text-stone-400 hover:text-rose-500 text-xs"
                              >
                                Удалить
                              </button>
                            </div>
                            {item.variantLabel && (
                              <p className="text-xs text-emerald-700 font-medium mb-1">{item.variantLabel}</p>
                            )}
                            {item.note && (
                              <p className="text-xs text-stone-500 italic mb-2">«{item.note}»</p>
                            )}
                            <div className="flex items-center justify-between mt-2">
                              <div className="flex items-center gap-2 bg-white border border-stone-200 rounded-lg px-2 py-1">
                                <button
                                  onClick={() => updateQty(item.cartKey, -1)}
                                  className="px-1.5 hover:bg-stone-100 rounded font-bold"
                                >
                                  −
                                </button>
                                <span className="text-xs font-bold px-1.5">{item.qty}</span>
                                <button
                                  onClick={() => updateQty(item.cartKey, 1)}
                                  className="px-1.5 hover:bg-stone-100 rounded font-bold"
                                >
                                  +
                                </button>
                              </div>
                              <span className="font-bold text-sm">
                                {item.prefix}{item.price * item.qty} ₽
                              </span>
                            </div>
                          </div>
                        ))}
                      </div>

                      <form id="order-form" onSubmit={handleSubmitOrder} className="space-y-3 pt-3 border-t border-stone-200">
                        <h4 className="font-bold text-sm text-stone-900">Данные для отправки</h4>
                        <input
                          type="text"
                          required
                          placeholder="Ваше имя *"
                          value={customerName}
                          onChange={e => setCustomerName(e.target.value)}
                          className="w-full text-sm border border-stone-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-emerald-600"
                        />
                        <input
                          type="text"
                          required
                          placeholder="Телефон или ник в Telegram *"
                          value={customerContact}
                          onChange={e => setCustomerContact(e.target.value)}
                          className="w-full text-sm border border-stone-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-emerald-600"
                        />
                        <select
                          value={deliveryMethod}
                          onChange={e => setDeliveryMethod(e.target.value)}
                          className="w-full text-sm border border-stone-300 rounded-xl px-3.5 py-2.5 bg-white focus:outline-none focus:border-emerald-600"
                        >
                          <option value="СДЭК / Почта России">Доставка: СДЭК / Почта России</option>
                          <option value="Самовывоз">Самовывоз</option>
                          <option value="Электронный формат">Электронный формат (на почту / в TG)</option>
                        </select>
                        <textarea
                          rows="2"
                          placeholder="Пожелания к заказу (необязательно)"
                          value={orderComment}
                          onChange={e => setOrderComment(e.target.value)}
                          className="w-full text-sm border border-stone-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-emerald-600"
                        />
                      </form>
                    </>
                  )}

                  {orderStatus && (
                    <div className={`p-3.5 rounded-xl text-xs ${
                      orderStatus.type === 'success' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' :
                      orderStatus.type === 'demo' ? 'bg-amber-50 text-amber-800 border border-amber-200' :
                      'bg-rose-50 text-rose-800 border border-rose-200'
                    }`}>
                      {orderStatus.message}
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-5 border-t border-stone-200 bg-stone-50 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-sm text-stone-600">Итого к оплате:</span>
                      <span className="text-xl font-bold text-stone-900">
                        {hasFromPrice ? 'от ' : ''}{totalPrice} ₽
                      </span>
                    </div>

                    <button
                      type="submit"
                      form="order-form"
                      disabled={isSubmitting}
                      className="w-full bg-emerald-700 hover:bg-emerald-800 disabled:opacity-50 text-white font-semibold py-3 rounded-xl transition shadow-sm"
                    >
                      {isSubmitting ? 'Отправка...' : 'Отправить заказ'}
                    </button>

                    <button
                      type="button"
                      onClick={handleCopyOrder}
                      className="w-full bg-white hover:bg-stone-100 text-stone-700 border border-stone-300 font-medium py-2.5 rounded-xl text-xs transition"
                    >
                      {copied ? '✓ Текст заказа скопирован!' : 'Скопировать заказ вручную'}
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
